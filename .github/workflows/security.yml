name: SAST, SCA and Secret Scanning

on:
  pull_request:
    branches: [ dev ]

jobs:
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run AppScan SAST & DAST
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@v1.0.9
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          application_id: 8ccb0644-a3b6-4755-aba5-b85cebefd1c0
          scan_name: ${{ github.repository }}-pr-${{ github.event.pull_request.number }}
          incremental_scan: true
          wait_for_analysis: true
          fail_for_noncompliance: true
          failure_threshold: Medium
          personal_scan: ${{ vars.DEBUG_MODE }}

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
